name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Zig bootstrap failure boundaries
        run: |
          bash tests/ci_zig_install.sh
          bash tests/nightly_zig_install.sh

      - name: Install official Zig release
        run: bash scripts/install-ci-zig.sh

      - name: rust core
        run: WUPZ_EXPECT_BACKEND=zig-simd cargo test --quiet

      - name: benchmark comparison contract
        run: bash tests/bench_smoke.sh

      - name: zig kernels (differential)
        run: zig test wupz-zig/src/kernels.zig

      - name: static libs + C ABI parity test
        run: |
          mkdir -p build
          zig build-lib wupz-zig/src/kernels.zig -O ReleaseFast -femit-bin=build/libwupz_zig.a
          cargo build --release --quiet
          zig cc tests/abi_smoke.c -Iinclude build/libwupz_zig.a target/release/libwupz_core.a -o build/abi_smoke
          ./build/abi_smoke
