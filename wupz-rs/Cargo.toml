[package]
name = "wupz-core"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "wupz core — the incremental layout plan, the arena, and pack-in-pass (scaffold)"
repository = "https://github.com/8b-is/wupz"
build = "build.rs"

[lib]
name = "wupz_core"
crate-type = ["rlib", "staticlib"]

[features]
default = ["std", "extras"]
# Disable for bare-metal use (kernel8): no_std + alloc, scalar fold, no C ABI linkage needs.
std = []
# The upz superset: CORDIC atan2, the group-wise ternary quantizer, PC-relative
# reloc patching, env-entropy collection, and the 6-register song signals.
# `--no-default-features` yields exactly the wupz-core surface.
extras = []

[dependencies]
