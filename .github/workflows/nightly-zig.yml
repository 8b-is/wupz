name: nightly-zig

# The bleeding-edge lane: does the master Zig still compile the kernels, and does
# the Rust↔Zig seam still hold? Runs nightly and on demand.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Nightly Zig bootstrap failure boundaries
        run: bash tests/nightly_zig_install.sh

      - name: Install official Zig master snapshot
        run: bash scripts/install-nightly-zig.sh

      - name: zig version (master)
        run: zig version

      - name: kernels on Zig master (differential vs scalar)
        run: zig test wupz-zig/src/kernels.zig

      - name: the seam on Zig master (Rust core links the master-built kernels)
        run: WUPZ_EXPECT_BACKEND=zig-simd cargo test --quiet
